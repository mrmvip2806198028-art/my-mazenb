<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Mazen Store</title><style>body{margin:0;background:#11161b;color:#fff;font-family:Arial;padding:20px}.box{max-width:850px;margin:20px auto;background:#1b2229;border:1px solid #303841;border-radius:18px;padding:20px}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 15px;border-radius:10px;border:1px solid #3a444e;background:#11161b;color:#fff}button{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}.primary{background:#168cff;color:#fff}.dark{background:#252d35;color:#fff}.danger{background:#d33;color:#fff}.row{display:flex;gap:10px}.row>*{flex:1}.item{display:flex;gap:10px;align-items:center;background:#252d35;padding:10px;border-radius:12px;margin:8px 0}.item img{width:60px;height:60px;object-fit:cover;border-radius:8px}.hidden{display:none}.msg{color:#ffd45a}</style></head><body><div id="login" class="box"><h2>🔐 إدارة Mazen Store</h2><p>الدخول للمالك فقط</p><input id="password" type="password" placeholder="كلمة مرور الإدارة"><button class="primary" onclick="login()">دخول</button><p id="msg" class="msg"></p></div><div id="panel" class="box hidden"><h2>⚙️ لوحة الإدارة</h2><input id="name" placeholder="اسم المتجر"><input id="desc" placeholder="وصف المتجر"><input id="phone" placeholder="رقم واتساب مثل 2010XXXXXXXX"><h3>المنتجات</h3><div id="items"></div><button class="primary" onclick="add()">➕ إضافة منتج</button><div class="row" style="margin-top:15px"><button class="primary" onclick="save()">💾 حفظ كل التغييرات</button><button class="dark" onclick="logout()">تسجيل الخروج</button></div></div><script>let data,edit=[];async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok){loginBox(false);load()}else msg.textContent='كلمة المرور غير صحيحة'}function loginBox(x){login.className=x?'box':'box hidden';panel.className=x?'box hidden':'box'}async function load(){data=await(await fetch('/api/store')).json();name.value=data.name;desc.value=data.desc;phone.value=data.phone||'';render()}function render(){items.innerHTML=data.products.map((p,i)=>`<div class="item">${p.image?`<img src="${p.image}">`:''}<div style="flex:1"><b>${esc(p.name)}</b><br>${p.price} ج.م</div><button class="dark" onclick="edit(${i})">تعديل</button><button class="danger" onclick="del(${i})">حذف</button></div>`).join('')||'لا توجد منتجات'}function add(){data.products.push({name:'منتج جديد',price:0,desc:'',image:''});edit(data.products.length-1)}function edit(i){let p=data.products[i];let n=prompt('اسم المنتج',p.name);if(n===null)return;let pr=prompt('السعر',p.price);let d=prompt('الوصف',p.desc);if(n.trim()){p.name=n.trim();p.price=pr||0;p.desc=d||'';render()}}function del(i){if(confirm('حذف المنتج؟')){data.products.splice(i,1);render()}}async function save(){data.name=name.value.trim()||'Mazen Store';data.desc=desc.value.trim()||'برفانات ومنتجات مميزة';data.phone=phone.value.replace(/\D/g,'');let r=await fetch('/api/store',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok)alert('تم الحفظ')}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}fetch('/api/me').then(r=>r.json()).then(x=>{if(x.owner)loginBox(false)})</script></body></html>
